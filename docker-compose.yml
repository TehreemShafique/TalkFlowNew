services:
  backend:
    build:
      context: ./apps/backend
    container_name: talkflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://talkflow:admin@postgres:5432/talkflow
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-gateway:
    build:
      context: ./services/ai-gateway
    container_name: talkflow-ai-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=development
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
