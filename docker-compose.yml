    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: talkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkflow
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: talkflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkflow -d talkflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: talkflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  vllm:
    image: vllm/vllm-openai:latest
    container_name: talkflow-vllm
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./services/ai-gateway/models:/app/models
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - VLLM_USE_V2_MODEL_RUNNER=0
      - PYTHONUNBUFFERED=1
    command: --host 0.0.0.0 --port 8100 --model /app/models/Qwen2.5-1.5B-Instruct-AWQ --served-model-name Qwen/Qwen2.5-1.5B-Instruct-AWQ --dtype auto --quantization awq --max-model-len 2048 --gpu-memory-utilization 0.75
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kafka:
    image: apache/kafka:3.7.0
    container_name: talkflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  recording-worker:
    build:
      context: .
      dockerfile: services/recording-worker/Dockerfile
    container_name: talkflow-recording-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage/recordings:/app/storage/recordings
      - ./secrets/asterisk_recording_key:/run/secrets/asterisk_recording_key:ro
      - ./secrets/asterisk_known_hosts:/run/secrets/asterisk_known_hosts:ro

volumes:
  postgres_data:
  redis_data:
  kafka_data: